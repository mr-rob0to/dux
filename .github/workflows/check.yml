name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install bats, shellcheck, tmux, jq
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck tmux jq
      - name: Versions
        run: bats --version && shellcheck --version && tmux -V
      - run: make check

  # macOS is where Dux actually runs, and its /bin/bash is 3.2. Every script's
  # shebang resolves bash through PATH, so this job puts 3.2 first and runs the
  # whole suite, both backends included, against it.
  macos-bash32:
    runs-on: macos-latest
    env:
      TERM: xterm
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install bats, shellcheck, tmux
        run: brew install bats-core shellcheck tmux
      - name: Versions
        run: bats --version && shellcheck --version && tmux -V && /bin/bash --version | head -n 1
      - run: make check-bash32
